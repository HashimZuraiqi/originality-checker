# docker compose up --build   ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: originality
      POSTGRES_USER: originality
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U originality -d originality"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        SEMANTIC: ${SEMANTIC:-wordvec}
    image: originality-checker:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://originality:${POSTGRES_PASSWORD:-change-me}@db:5432/originality
      EMBEDDED_WORKER: "false"
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: originality-checker:latest
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true  # the image's HTTP health check does not apply to the worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://originality:${POSTGRES_PASSWORD:-change-me}@db:5432/originality
    volumes:
      - appdata:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  # Optional grammar/spelling engine: docker compose --profile grammar up
  languagetool:
    image: erikvl87/languagetool:latest
    profiles: ["grammar"]
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
